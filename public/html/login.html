<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bantoo! - Login</title>
  <!-- CSS Global -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/buttons.css">
  <link rel="stylesheet" href="../css/form.css">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="https://unpkg.com/htmx.org@1.9.2" integrity="sha384-L6OqL9pRWyyFU3+/bjdSri+iIphTN/bvYyM37tICVyOJkWZLpP2vGn6VUEXgzg6h" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.8"></script>
</head>
<body>
  <header>
    <h1>Bantoo!</h1>
    <nav>
      <a href="../html/index.html">Beranda</a>
      <a href="../html/register.html">Daftar</a>
    </nav>
  </header>
  <main>
    <section id="login">
      <h2>Login</h2>
      <form id="loginForm" hx-post="/api/login">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Login</button>
      </form>
      <p>Belum punya akun? <a href="../html/register.html">Daftar di sini</a>.</p>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Bantoo!. Semua hak dilindungi.</p>
  </footer>
</body>
</html>
