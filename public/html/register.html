          <input type="file" name="registerFoto" id="registerFoto" accept="image/jpeg" onchange="loadFoto(event)" hidden>
          <script>
            var loadFoto = function(event) {
              var file = event.target.files[0];
              if (['image/jpeg', 'image/jpg'].indexOf(file.type) < 0) return false;
              var reader = new FileReader();
              reader.onload = function() {
                var output = document.getElementById('profilePhoto');
                output.src = reader.result;
              };
              reader.readAsDataURL(event.target.files[0]);
            };
          </script>
